<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Reasons I Love You</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<style>
  .jars-row { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-bottom: 24px; }
  .jar-col { text-align: center; width: 160px; }
  .jar-btn {
    font-size: 4.5rem;
    background: none;
    border: none;
    cursor: pointer;
    filter: drop-shadow(0 8px 16px rgba(0,0,0,0.4));
    transition: transform 0.15s ease;
  }
  .jar-btn:active { transform: scale(0.92); }
  .jar-label { font-size: 0.8rem; margin-top: 4px; font-weight: 600; }
  .jar-reason {
    margin-top: 12px;
    border-radius: 14px;
    padding: 14px;
    font-style: italic;
    font-size: 0.9rem;
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .jar-reason.show { opacity: 1; }
  .add-box, .list-box {
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05);
    border-radius: 20px;
    padding: 18px;
    margin-top: 20px;
  }
  .reason-item {
    text-align: left;
    font-size: 0.85rem;
    padding: 8px 0;
    border-top: 1px solid rgba(255,255,255,0.08);
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: flex-start;
  }
  .reason-item .actions { display: flex; gap: 8px; flex-shrink: 0; }
  .reason-item button { background: none; border: none; cursor: pointer; font-size: 0.9rem; }
</style>
</head>
<body>

<div id="loading-gate" class="page" style="display:flex; align-items:center; justify-content:center;">
  <p style="opacity:0.6;">Opening the jars…</p>
</div>

<div id="app-root" class="page" style="visibility:hidden;">
  <div class="sky-layer"></div>

  <nav class="navbar">
    <a href="garden.html" class="brand" style="text-decoration:none;">🌸 Our Lily Garden</a>
    <a href="garden.html" class="btn-ghost" style="text-decoration:none;">← Back to garden</a>
  </nav>

  <main class="content">
    <div class="garden-heading">
      <h1>Reasons I Love You 🫙</h1>
      <p id="reason-count">Loading…</p>
    </div>

    <div class="jars-row" id="jars-row"></div>

    <form id="add-form" class="add-box">
      <div class="field">
        <label>Add a reason to your jar</label>
        <input type="text" id="reason-input" placeholder="I love the way you…" required />
      </div>
      <button type="submit" class="btn-send" id="add-btn">Add to my jar 🫙</button>
    </form>

    <div class="list-box">
      <label style="font-size:0.85rem; opacity:0.8;">Your written reasons</label>
      <div id="my-reasons-list"></div>
    </div>
  </main>
</div>

<script type="module">
  import { initJar } from "./js/jar.js";
  initJar();
</script>
</body>
</html>
