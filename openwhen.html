<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Open When...</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<style>
  .envelopes-grid { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; }
  .envelope {
    width: 200px;
    background: linear-gradient(135deg, var(--lavender), var(--pink));
    border-radius: 14px;
    padding: 24px 16px;
    text-align: center;
    color: var(--night-900);
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    transition: transform 0.2s ease;
  }
  .envelope:hover { transform: translateY(-4px) scale(1.02); }
  .envelope .icon { font-size: 2rem; display: block; margin-bottom: 10px; }
  .letter-modal {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(16,12,34,0.9);
    display: none;
    align-items: center; justify-content: center;
    padding: 24px;
  }
  .letter-modal.open { display: flex; }
  .letter-paper {
    background: #fdfaf3; color: var(--ink);
    border-radius: 12px; padding: 28px 24px;
    max-width: 420px; width: 100%;
    max-height: 80vh; overflow-y: auto;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }
  .letter-paper h2 { font-family: 'Fraunces', serif; font-style: italic; margin-top: 0; }
  .letter-paper .close-btn {
    display: block; margin: 20px auto 0;
    background: var(--pink); border: none; border-radius: 999px;
    padding: 10px 24px; font-weight: 700; cursor: pointer;
  }
  .write-box {
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05);
    border-radius: 20px;
    padding: 18px;
    margin-bottom: 28px;
  }
</style>
</head>
<body>

<div id="loading-gate" class="page" style="display:flex; align-items:center; justify-content:center;">
  <p style="opacity:0.6;">Gathering your letters…</p>
</div>

<div id="app-root" class="page" style="visibility:hidden;">
  <div class="sky-layer"></div>

  <nav class="navbar">
    <a href="garden.html" class="brand" style="text-decoration:none;">🌸 Our Lily Garden</a>
    <a href="garden.html" class="btn-ghost" style="text-decoration:none;">← Back to garden</a>
  </nav>

  <main class="content">
    <div class="garden-heading">
      <h1>Open When... 💌</h1>
      <p>Little letters, waiting for the right moment.</p>
    </div>

    <form id="write-form" class="write-box">
      <div class="field">
        <label>When should they open this?</label>
        <input type="text" id="letter-title" placeholder="e.g. Open when you're sad" required />
      </div>
      <div class="field">
        <label>Your letter</label>
        <textarea id="letter-content" rows="4" placeholder="Write from the heart…" required></textarea>
      </div>
      <button type="submit" class="btn-send" id="write-btn">Seal the letter 💌</button>
    </form>

    <p id="loading-state" class="loading-state">Loading letters…</p>
    <p id="empty-state" class="empty-state" style="display:none;">No letters yet — write the first one above 🌱</p>
    <div id="envelopes-grid" class="envelopes-grid"></div>
  </main>
</div>

<div id="letter-modal" class="letter-modal">
  <div class="letter-paper">
    <h2 id="modal-title"></h2>
    <p id="modal-content" style="white-space:pre-wrap; line-height:1.6;"></p>
    <div id="modal-owner-actions" style="display:none; gap:10px; justify-content:center; margin-bottom:12px;">
      <button id="modal-edit-btn" style="background:none; border:1px solid rgba(0,0,0,0.15); border-radius:999px; padding:6px 16px; cursor:pointer;">✏️ Edit</button>
      <button id="modal-delete-btn" style="background:none; border:1px solid rgba(0,0,0,0.15); border-radius:999px; padding:6px 16px; cursor:pointer;">🗑️ Delete</button>
    </div>
    <button class="close-btn" id="modal-close">Close 💌</button>
  </div>
</div>

<script type="module">
  import { initOpenWhen } from "./js/openwhen.js";
  initOpenWhen();
</script>
</body>
</html>
